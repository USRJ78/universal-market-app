<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Hat Capital - 2D Action</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    
    <!-- 2D Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay: HUD -->
    <div id="hud">
        <div class="hud-stat">CASH: <span id="hud-cash" class="highlight">$100,000</span></div>
        <div class="hud-stat">PORTFOLIO: <span id="hud-portfolio">$100,000</span></div>
        <div id="interaction-prompt" class="hidden">Press [E] to Interact</div>
    </div>
    
    <div id="news-ticker">
        <div id="news-scroll">Welcome to Los Santos. Get to your computer to trade stocks.</div>
    </div>

    <!-- UI Overlay: Trading Terminal (Hidden by default) -->
    <div id="trading-modal" class="modal hidden">
        <div class="glass-panel modal-content terminal-ui">
            <button class="close-btn" onclick="closeTerminal()">X</button>
            <div class="main-grid">
                
                <!-- Left: Market Watchlist -->
                <section class="watchlist-panel">
                    <h2>LCN EXCHANGE</h2>
                    <div class="watchlist" id="watchlist">
                        <!-- Injected via JS -->
                    </div>
                </section>

                <!-- Right: Trading Terminal -->
                <section class="terminal-panel">
                    <div class="terminal-header">
                        <h2 id="active-ticker">AEROCORP (AERO)</h2>
                        <span class="ticker-price" id="active-price">$150.00</span>
                    </div>
                    
                    <div class="chart-container">
                        <canvas id="marketChart"></canvas>
                    </div>

                    <div class="trading-controls">
                        <div class="control-group">
                            <label for="trade-shares">Shares</label>
                            <input type="number" id="trade-shares" value="10" min="1">
                        </div>
                        <div class="action-buttons">
                            <button class="btn btn-buy" id="btn-buy">BUY</button>
                            <button class="btn btn-sell" id="btn-sell">SELL</button>
                            <button class="btn btn-short" id="btn-short">SHORT</button>
                        </div>
                    </div>
                    
                    <div class="portfolio-section">
                        <h3>POSITIONS</h3>
                        <div id="positions-list"></div>
                    </div>
                </section>
            </div>
        </div>
    </div>
    
    <!-- Sabotage Confirmation Modal -->
    <div id="sabotage-modal" class="modal hidden">
        <div class="glass-panel sabotage-ui">
            <h2 id="sabotage-title">SABOTAGE TARGET?</h2>
            <p id="sabotage-desc">Are you sure you want to plant explosives?</p>
            <div class="action-buttons">
                <button class="btn btn-short" onclick="executeSabotage()">CONFIRM SABOTAGE</button>
                <button class="btn btn-sell" onclick="closeSabotage()">CANCEL</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
